[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
aareco-recorder = { path = "crates/recorder" }
aareco-store = { path = "crates/store" }
aareco-fx = { path = "crates/fx" }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
game-utils = "0.4"
hound = "3.5"
yadaw-plugin-api = { git = "https://github.com/mlm-games/yadaw", rev = "699f633" }
yadaw-plugin-host = { git = "https://github.com/mlm-games/yadaw", rev = "699f633", default-features = false, features = ["vst3-host", "clap-host"] }
cpal = "0.18"
rtrb = "0.4"
parking_lot = "0.13"
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "wav",
    "flac",
    "vorbis",
    "mp3",
] }
repose-core = "0.32"
repose-ui = "0.32"
repose-material = "0.32"
repose-platform = "0.32"
repose-canvas = "0.32"
repose-navigation = "0.32"
rlobkit-dialogs = "0.7"
rlobkit-core = "0.7"

[package]
name = "aareco"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A voice recorder with a topic tree"
default-run = "aareco-desktop"

[lib]
name = "aareco"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aareco-desktop"
path = "src/main.rs"

[package.metadata.android]
package = "app.aareco"
apk_name = "aareco"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
resources = "others/packaging/res"

[package.metadata.android.application]
label = "Aareco"
fullscreen = false
icon = "@mipmap/ic_launcher"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 37
version_code = 1

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.application.activity]]
name = "rust.rlobkit.RlobKitMainActivity"
exported = true
launch_mode = "singleTask"
config_changes = "orientation|keyboardHidden|screenSize|uiMode"
enable_on_back_invoked_callback = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
directories.workspace = true
game-utils.workspace = true
yadaw-plugin-api.workspace = true
hound.workspace = true
rodio.workspace = true

aareco-recorder.workspace = true
aareco-store.workspace = true
aareco-fx.workspace = true

repose-core.workspace = true
repose-ui.workspace = true
repose-material.workspace = true
repose-platform.workspace = true
repose-canvas.workspace = true
repose-navigation.workspace = true

rlobkit-dialogs.workspace = true
rlobkit-core.workspace = true

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rlobkit-app-events = { version = "0.7", features = ["jni-bridge"] }
jni = "0.22"
ndk-context = "0.1"
winit = { version = "0.30", features = ["android-native-activity"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
